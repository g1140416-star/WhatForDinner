<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎰 VEGAS LOTTO - 今日大餐開獎機 🎰</title>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --vegas-bg: #0D021A;
      --card-bg: #1A0B2E;
      --gold-light: #FFE57F;
      --gold-primary: #FFD700;
      --gold-dark: #B8860B;
      --neon-red: #FF0055;
      --neon-green: #00FF66;
      --neon-blue: #00E5FF;
      --text-color: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', 'Marcellus', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--vegas-bg);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 14px 30px 14px;
      background-image: 
        radial-gradient(circle at 50% 20%, #2A085C 0%, transparent 60%),
        radial-gradient(#3B1578 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 380px;
    }

    header h1 {
      font-family: 'Marcellus', 'Zen Maru Gothic', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold-light);
      text-shadow: 
        0 0 10px var(--gold-primary),
        0 0 20px var(--neon-red),
        0 0 30px var(--neon-red);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 0.82rem;
      color: var(--neon-blue);
      text-shadow: 0 0 5px var(--neon-blue);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* 星期選擇器 - Vegas 俱樂部風格 */
    .day-selector-card {
      width: 100%;
      max-width: 380px;
      background: rgba(26, 11, 46, 0.8);
      border: 2px solid var(--gold-dark);
      border-radius: 16px;
      padding: 8px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .day-select {
      padding: 4px 8px;
      border-radius: 8px;
      border: 1.5px solid var(--gold-primary);
      background: #2D0B5A;
      color: var(--gold-light);
      font-weight: 900;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }

    /* 賭場機台外殼 */
    .casino-machine {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #3A0007 0%, #1A0003 100%);
      border: 5px solid var(--gold-primary);
      border-radius: 32px;
      padding: 24px 18px;
      box-shadow: 
        0 0 25px rgba(255, 215, 0, 0.4),
        inset 0 0 20px rgba(0, 0, 0, 0.8),
        0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    /* 閃爍跑馬燈球 */
    .marquee-lights {
      position: absolute;
      top: -12px;
      display: flex;
      gap: 12px;
    }

    .light-bulb {
      width: 14px;
      height: 14px;
      background: var(--gold-light);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-primary);
      animation: bulbBlink 0.8s infinite alternate;
    }

    .light-bulb:nth-child(even) {
      animation-delay: 0.4s;
      background: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red);
    }

    @keyframes bulbBlink {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* 樂透彩球風格 */
    .ball-container {
      width: 125px;
      height: 125px;
      background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, var(--gold-primary) 50%, #8B6508 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 
        0 10px 25px rgba(0,0,0,0.8),
        inset -8px -8px 15px rgba(0,0,0,0.6),
        inset 8px 8px 15px rgba(255,255,255,0.9),
        0 0 15px var(--gold-primary);
      margin-bottom: 18px;
      border: 4px solid #FFF;
      position: relative;
    }

    .ball-number {
      font-size: 3rem;
      font-weight: 900;
      color: #0D021A;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
    }

    .rolling {
      animation: vegasRoll 0.12s infinite linear;
    }

    @keyframes vegasRoll {
      0% { transform: rotate(0deg) scale(0.96); filter: drop-shadow(0 0 10px var(--neon-red)); }
      50% { transform: rotate(180deg) scale(1.04); filter: drop-shadow(0 0 15px var(--gold-primary)); }
      100% { transform: rotate(360deg) scale(0.96); filter: drop-shadow(0 0 10px var(--neon-blue)); }
    }

    /* Vegas 霓虹顯示螢幕 */
    .display-screen {
      width: 100%;
      background: #05000A;
      border: 3px solid var(--gold-dark);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.3);
    }

    .store-name-display {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--gold-light);
      text-shadow: 
        0 0 5px var(--gold-primary),
        0 0 12px var(--gold-primary);
      word-break: break-all;
    }

    .store-status {
      font-size: 0.8rem;
      color: var(--neon-green);
      text-shadow: 0 0 5px var(--neon-green);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    /* 賭場金光開獎按鈕 */
    .action-btn {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, #FF0055 0%, #990033 100%);
      color: #FFF;
      border: 3px solid var(--gold-primary);
      padding: 16px;
      border-radius: 22px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 
        0 0 15px rgba(255, 0, 85, 0.6),
        0 6px 0px #660022;
      transition: all 0.1s;
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 
        0 0 10px rgba(255, 0, 85, 0.4),
        0 2px 0px #660022;
    }

    /* 導航按鈕 */
    .map-btn {
      display: none;
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, #00E5FF 0%, #0088CC 100%);
      color: #000;
      border: 2px solid #FFF;
      padding: 13px;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    .pool-info {
      font-size: 0.78rem;
      color: var(--neon-blue);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎰 CASINO LOTTO 🎰</h1>
    <div class="sub-title">LAS VEGAS EDITION • 今日美食開獎機</div>
  </header>

  <!-- 星期切換器 -->
  <div class="day-selector-card">
    <span>📅 模擬當前星期：</span>
    <select class="day-select" id="daySelect" onchange="updateAvailablePool()">
      <option value="0">SUNDAY (星期日)</option>
      <option value="1">MONDAY (星期一)</option>
      <option value="2">TUESDAY (星期二)</option>
      <option value="3">WEDNESDAY (星期三)</option>
      <option value="4">THURSDAY (星期四)</option>
      <option value="5">FRIDAY (星期五)</option>
      <option value="6">SATURDAY (星期六)</option>
    </select>
  </div>

  <!-- Vegas 賭場風格搖獎機 -->
  <div class="casino-machine">
    <div class="marquee-lights">
      <div class="light-bulb"></div>
      <div class="light-bulb"></div>
      <div class="light-bulb"></div>
      <div class="light-bulb"></div>
      <div class="light-bulb"></div>
    </div>

    <div class="ball-container" id="ball">
      <div class="ball-number" id="ballNum">777</div>
    </div>

    <div class="display-screen">
      <div class="store-name-display" id="storeName">PRESS TO WIN!</div>
      <div class="store-status" id="storeStatus">READY FOR JACKPOT...</div>
    </div>
  </div>

  <button class="action-btn" id="drawBtn" onclick="startLotto()">🎲 PULL THE LEVER / 開獎！</button>
  <a class="map-btn" id="mapBtn" href="#" target="_blank">🗺️ 查看 GOOGLE MAPS 導航</a>

  <div class="pool-info" id="poolInfo">計算可抽餐廳中...</div>

  <script>
    var restaurantList = [
      { name: "麥當勞", off: [], map: "" },
      { name: "肯德基", off: [], map: "" },
      { name: "拿坡里", off: [], map: "" },
      { name: "必勝客", off: [], map: "" },
      { name: "美珠土雞店", off: [1], map: "https://maps.app.goo.gl/Y2hL3krg3DHbXXkq8" },
      { name: "小文", off: [2], map: "https://maps.app.goo.gl/uqv3uXAdW1ancuvd8" },
      { name: "安一路潤餅", off: [0], map: "https://maps.app.goo.gl/YXCVkD5pLyyG3kL46" },
      { name: "悟饕", off: [6, 0], map: "https://maps.app.goo.gl/dWLznpQyvk1SZ11n7" },
      { name: "大無敵烤肉飯", off: [], map: "https://maps.app.goo.gl/khUZ81K5KntAwsTr9" },
      { name: "北海鐵板燒", off: [3], map: "https://maps.app.goo.gl/7qKDjigoUvGV8oECL9" },
      { name: "郭家巷頭粿仔湯", off: [], map: "https://maps.app.goo.gl/wUh9nfXYYraiZaw79" },
      { name: "漫食雞肉便當", off: [2, 0], map: "https://maps.app.goo.gl/KDPJouj3eFnwYp2V9" },
      { name: "富貴元", off: [6], map: "https://maps.app.goo.gl/YScF8m597zSHar5f7" },
      { name: "紅豆坊", off: [3], map: "https://maps.app.goo.gl/3sHZ8bR38cLdSDJz6" },
      { name: "西定路福隆便當", off: [], map: "https://maps.app.goo.gl/ypuRZSakojLcbAnm9" },
      { name: "宜隆福隆便當", off: [1, 2, 3, 6, 0], map: "https://maps.app.goo.gl/HmdyTAmjcC3H8rQC8" },
      { name: "竹籬", off: [0, 1], map: "https://maps.app.goo.gl/sthBr9PCaWXWy9jY8" },
      { name: "連記蚵仔麵線肉圓", off: [0], map: "https://maps.app.goo.gl/qTE9tZRPVSzakbTW6" },
      { name: "阿忠食堂", off: [6, 0], map: "https://maps.app.goo.gl/ui2FeaQNAZAscrFr5" },
      { name: "小羅牛肉麵", off: [1, 2], map: "https://maps.app.goo.gl/Pqn8ppZiTMHUnpaL6" },
      { name: "詹欽牛肉麵", off: [0], map: "https://maps.app.goo.gl/LMeFdv3rtWNgkmqQ9" },
      { name: "一麵之緣", off: [3], map: "https://maps.app.goo.gl/dPHXNFP5gjQZpr8CA" },
      { name: "復興27魷魚羹麵", off: [3, 0], map: "https://maps.app.goo.gl/XcYufd2ecNg527GB8" },
      { name: "嬌媽媽手工大水餃", off: [6, 0], map: "https://maps.app.goo.gl/BncQv92vHFN9vheGA" },
      { name: "八方雲集", off: [], map: "https://maps.app.goo.gl/nZ9ySetnfRVe7G6Q7" },
      { name: "鼎好精緻美食", off: [6], map: "https://maps.app.goo.gl/QJNoUHxDsa3zCMhw9" },
      { name: "飯殿", off: [1, 2], map: "https://maps.app.goo.gl/88QkvEc5zjcqQkKB9" },
      { name: "巷仔口熱炒", off: [2], map: "https://maps.app.goo.gl/PVonXssCEDn6GMuB6" },
      { name: "柯媽媽", off: [3, 0], map: "" },
      { name: "中壢牛肉麵", off: [], map: "https://maps.app.goo.gl/xCpcNVWS34n9JhBJ9" },
      { name: "火雞肉飯便當", off: [0], map: "https://maps.app.goo.gl/7MVHM8m5j15qS8Z3A" },
      { name: "胖老爹", off: [3], map: "https://maps.app.goo.gl/QGbNyk3jMrJ9BvJ6" },
      { name: "羅國夫", off: [0], map: "https://maps.app.goo.gl/Xq1ynVSxfTBdjxed7" },
      { name: "好運涼麵", off: [], map: "https://maps.app.goo.gl/kHV9RPuxhaEwnCn8A" },
      { name: "天一番肉羹順", off: [], map: "https://maps.app.goo.gl/dFeHziRw5fWR8G1u7" },
      { name: "廟口滷排骨飯", off: [], map: "https://maps.app.goo.gl/oV66Sp6oHFHX28U36" },
      { name: "廟口49號刈包四神湯", off: [], map: "https://maps.app.goo.gl/kcn2NoBuVEL7eTnv5" },
      { name: "思維麵食館", off: [1], map: "https://maps.app.goo.gl/WqYirZuTUuec23by5" },
      { name: "春美肉圓+麵線", off: [1], map: "https://maps.app.goo.gl/HKDjTVXnayX5ZS1y7" }
    ];

    var availablePool = [];
    var isRolling = false;

    function initDay() {
      var todayDay = new Date().getDay();
      document.getElementById('daySelect').value = todayDay;
      updateAvailablePool();
    }

    function updateAvailablePool() {
      var selectedDay = parseInt(document.getElementById('daySelect').value);
      availablePool = restaurantList.filter(function(item) {
        return !item.off.includes(selectedDay);
      });

      var totalCount = restaurantList.length;
      var activeCount = availablePool.length;

      document.getElementById('poolInfo').textContent = 
        'AVAILABLE: ' + activeCount + ' / TOTAL: ' + totalCount + ' STORES';
    }

    function startLotto() {
      if (isRolling) return;
      if (availablePool.length === 0) {
        alert('ALL STORES CLOSED TODAY!');
        return;
      }

      isRolling = true;
      var ball = document.getElementById('ball');
      var ballNum = document.getElementById('ballNum');
      var storeName = document.getElementById('storeName');
      var storeStatus = document.getElementById('storeStatus');
      var mapBtn = document.getElementById('mapBtn');

      ball.classList.add('rolling');
      mapBtn.style.display = 'none';
      storeStatus.textContent = '🎰 ROLLING THE DICE...';

      var timer = setInterval(function() {
        var randomTemp = availablePool[Math.floor(Math.random() * availablePool.length)];
        storeName.textContent = randomTemp.name;
        ballNum.textContent = Math.floor(Math.random() * 899) + 100;
      }, 70);

      setTimeout(function() {
        clearInterval(timer);
        ball.classList.remove('rolling');

        var finalWinner = availablePool[Math.floor(Math.random() * availablePool.length)];

        ballNum.textContent = '777';
        storeName.textContent = finalWinner.name;
        storeStatus.textContent = '🎉 WINNER WINNER CHICKEN DINNER!';

        if (finalWinner.map && finalWinner.map.trim() !== '') {
          mapBtn.href = finalWinner.map;
          mapBtn.style.display = 'block';
        } else {
          mapBtn.href = 'https://www.google.com/maps/search/' + encodeURIComponent(finalWinner.name);
          mapBtn.style.display = 'block';
        }

        isRolling = false;
      }, 2200);
    }

    window.onload = function() {
      initDay();
    };
  </script>
</body>
</html>
