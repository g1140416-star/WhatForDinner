<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎰 今日美食樂透開獎機 🎰</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1A1A2E;
      --card-bg: #16213E;
      --gold-primary: #FFD700;
      --gold-dark: #D4AF37;
      --accent-red: #E94560;
      --text-color: #FFFFFF;
      --light-text: #E0E0E0;
      --border-color: #FFD700;
      --shadow: 0 10px 25px rgba(255, 215, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 14px 30px 14px;
      background-image: radial-gradient(#2A2A4A 1.5px, transparent 1.5px);
      background-size: 18px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 380px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold-primary);
      text-shadow: 0 2px 8px rgba(255, 215, 0, 0.5);
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 0.85rem;
      color: var(--light-text);
      font-weight: 700;
    }

    .day-selector-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 2px solid var(--gold-dark);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .day-select {
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--gold-primary);
      background: #0F3460;
      color: #FFF;
      font-weight: 700;
      outline: none;
    }

    /* 樂透開獎機螢幕容器 */
    .lotto-machine {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(145deg, #0F3460, #16213E);
      border: 4px solid var(--gold-primary);
      border-radius: 28px;
      padding: 20px 16px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    /* 樂透彩球顯示區 */
    .ball-container {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle at 30% 30%, #FFE600, #FF9900);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset -5px -5px 15px rgba(0,0,0,0.4), inset 5px 5px 15px rgba(255,255,255,0.8);
      margin-bottom: 16px;
      border: 3px solid #FFF;
      position: relative;
      overflow: hidden;
    }

    .ball-number {
      font-size: 2.8rem;
      font-weight: 900;
      color: #1A1A2E;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    }

    /* 滾動彩球動畫 */
    .rolling {
      animation: ballRoll 0.15s infinite linear;
    }

    @keyframes ballRoll {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    /* 店名顯示面板 */
    .display-screen {
      width: 100%;
      background: #000;
      border: 2px solid var(--gold-dark);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,255,0,0.2);
    }

    .store-name-display {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold-primary);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
      word-break: break-all;
    }

    .store-status {
      font-size: 0.78rem;
      color: #00FF66;
      margin-top: 4px;
    }

    /* 操作按鈕 */
    .action-btn {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, var(--accent-red) 0%, #C02739 100%);
      color: #FFF;
      border: 3px solid var(--gold-primary);
      padding: 14px;
      border-radius: 20px;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(233, 69, 96, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      text-align: center;
      margin-bottom: 16px;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    /* 地圖地標導航按鈕 */
    .map-btn {
      display: none;
      width: 100%;
      max-width: 380px;
      background: #00ADB5;
      color: #FFF;
      border: 2px solid #A6E3E9;
      padding: 12px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 173, 181, 0.3);
    }

    /* 名單總覽彈窗/列表區 */
    .pool-info {
      font-size: 0.75rem;
      color: var(--light-text);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎰 美食樂透開獎機 🎰</h1>
    <div class="sub-title">自動避開今日公休日 • 幸運開出今日大餐！</div>
  </header>

  <!-- 星期切換器（預設為今天） -->
  <div class="day-selector-card">
    <span>📅 當前抽籤目標：</span>
    <select class="day-select" id="daySelect" onchange="updateAvailablePool()">
      <option value="0">星期日 (Sun)</option>
      <option value="1">星期一 (Mon)</option>
      <option value="2">星期二 (Tue)</option>
      <option value="3">星期三 (Wed)</option>
      <option value="4">星期四 (Thu)</option>
      <option value="5">星期五 (Fri)</option>
      <option value="6">星期六 (Sat)</option>
    </select>
  </div>

  <!-- 樂透搖獎機介面 -->
  <div class="lotto-machine">
    <div class="ball-container" id="ball">
      <div class="ball-number" id="ballNum">?</div>
    </div>

    <div class="display-screen">
      <div class="store-name-display" id="storeName">按下開獎鈕！</div>
      <div class="store-status" id="storeStatus">準備開獎中...</div>
    </div>
  </div>

  <button class="action-btn" id="drawBtn" onclick="startLotto()">🎱 搖出今日幸運美食！</button>
  <a class="map-btn" id="mapBtn" href="#" target="_blank">🗺️ 查看 Google 地圖導航</a>

  <div class="pool-info" id="poolInfo">正在計算今日可抽餐廳...</div>

  <script>
    // 完整的 36 家餐廳資料庫 (含英文店休日判斷)
    var restaurantList = [
      { name: "麥當勞", off: [], map: "" },
      { name: "肯德基", off: [], map: "" },
      { name: "拿坡里", off: [], map: "" },
      { name: "必勝客", off: [], map: "" },
      { name: "美珠土雞店", off: [1], map: "https://maps.app.goo.gl/Y2hL3krg3DHbXXkq8" },
      { name: "小文", off: [2], map: "https://maps.app.goo.gl/uqv3uXAdW1ancuvd8" },
      { name: "安一路潤餅", off: [0], map: "https://maps.app.goo.gl/YXCVkD5pLyyG3kL46" },
      { name: "悟饕", off: [6, 0], map: "https://maps.app.goo.gl/dWLznpQyvk1SZ11n7" },
      { name: "大無敵烤肉飯", off: [], map: "https://maps.app.goo.gl/khUZ81K5KntAwsTr9" },
      { name: "北海鐵板燒", off: [3], map: "https://maps.app.goo.gl/7qKDjigoUvGV8oECL9" },
      { name: "郭家巷頭粿仔湯", off: [], map: "https://maps.app.goo.gl/wUh9nfXYYraiZaw79" },
      { name: "漫食雞肉便當", off: [2, 0], map: "https://maps.app.goo.gl/KDPJouj3eFnwYp2V9" },
      { name: "富貴元", off: [6], map: "https://maps.app.goo.gl/YScF8m597zSHar5f7" },
      { name: "紅豆坊", off: [3], map: "https://maps.app.goo.gl/3sHZ8bR38cLdSDJz6" },
      { name: "西定路福隆便當", off: [], map: "https://maps.app.goo.gl/ypuRZSakojLcbAnm9" },
      { name: "宜隆福隆便當", off: [1, 2, 3, 6, 0], map: "https://maps.app.goo.gl/HmdyTAmjcC3H8rQC8" },
      { name: "竹籬", off: [0, 1], map: "https://maps.app.goo.gl/sthBr9PCaWXWy9jY8" },
      { name: "連記蚵仔麵線肉圓", off: [0], map: "https://maps.app.goo.gl/qTE9tZRPVSzakbTW6" },
      { name: "阿忠食堂", off: [6, 0], map: "https://maps.app.goo.gl/ui2FeaQNAZAscrFr5" },
      { name: "小羅牛肉麵", off: [1, 2], map: "https://maps.app.goo.gl/Pqn8ppZiTMHUnpaL6" },
      { name: "詹欽牛肉麵", off: [0], map: "https://maps.app.goo.gl/LMeFdv3rtWNgkmqQ9" },
      { name: "一麵之緣", off: [3], map: "https://maps.app.goo.gl/dPHXNFP5gjQZpr8CA" },
      { name: "復興27魷魚羹麵", off: [3, 0], map: "https://maps.app.goo.gl/XcYufd2ecNg527GB8" },
      { name: "嬌媽媽手工大水餃", off: [6, 0], map: "https://maps.app.goo.gl/BncQv92vHFN9vheGA" },
      { name: "八方雲集", off: [], map: "https://maps.app.goo.gl/nZ9ySetnfRVe7G6Q7" },
      { name: "鼎好精緻美食", off: [6], map: "https://maps.app.goo.gl/QJNoUHxDsa3zCMhw9" },
      { name: "飯殿", off: [1, 2], map: "https://maps.app.goo.gl/88QkvEc5zjcqQkKB9" },
      { name: "巷仔口熱炒", off: [2], map: "https://maps.app.goo.gl/PVonXssCEDn6GMuB6" },
      { name: "柯媽媽", off: [3, 0], map: "" },
      { name: "中壢牛肉麵", off: [], map: "https://maps.app.goo.gl/xCpcNVWS34n9JhBJ9" },
      { name: "火雞肉飯便當", off: [0], map: "https://maps.app.goo.gl/7MVHM8m5j15qS8Z3A" },
      { name: "胖老爹", off: [3], map: "https://maps.app.goo.gl/QGbNyk3jMrJ9BvJ6" },
      { name: "羅國夫", off: [0], map: "https://maps.app.goo.gl/Xq1ynVSxfTBdjxed7" },
      { name: "好運涼麵", off: [], map: "https://maps.app.goo.gl/kHV9RPuxhaEwnCn8A" },
      { name: "天一番肉羹順", off: [], map: "https://maps.app.goo.gl/dFeHziRw5fWR8G1u7" },
      { name: "廟口滷排骨飯", off: [], map: "https://maps.app.goo.gl/oV66Sp6oHFHX28U36" },
      { name: "廟口49號刈包四神湯", off: [], map: "https://maps.app.goo.gl/kcn2NoBuVEL7eTnv5" },
      { name: "思維麵食館", off: [1], map: "https://maps.app.goo.gl/WqYirZuTUuec23by5" },
      { name: "春美肉圓+麵線", off: [1], map: "https://maps.app.goo.gl/HKDjTVXnayX5ZS1y7" }
    ];

    var availablePool = [];
    var isRolling = false;

    // 初始化自動定位今天
    function initDay() {
      var todayDay = new Date().getDay(); // 0 = Sun, 1 = Mon ...
      document.getElementById('daySelect').value = todayDay;
      updateAvailablePool();
    }

    // 依據選擇的星期，自動過濾公休店家
    function updateAvailablePool() {
      var selectedDay = parseInt(document.getElementById('daySelect').value);
      availablePool = restaurantList.filter(function(item) {
        return !item.off.includes(selectedDay);
      });

      var totalCount = restaurantList.length;
      var activeCount = availablePool.length;
      var closedCount = totalCount - activeCount;

      document.getElementById('poolInfo').textContent = 
        '總共 ' + totalCount + ' 家 | 當日營業 ' + activeCount + ' 家 | 公休過濾 ' + closedCount + ' 家';
    }

    // 開始樂透搖號動畫
    function startLotto() {
      if (isRolling) return;
      if (availablePool.length === 0) {
        alert('選取的當天所有店家剛好都公休喔！');
        return;
      }

      isRolling = true;
      var ball = document.getElementById('ball');
      var ballNum = document.getElementById('ballNum');
      var storeName = document.getElementById('storeName');
      var storeStatus = document.getElementById('storeStatus');
      var mapBtn = document.getElementById('mapBtn');

      ball.classList.add('rolling');
      mapBtn.style.display = 'none';
      storeStatus.textContent = '🎰 樂透彩球滾動中...';

      // 跳字動畫
      var timer = setInterval(function() {
        var randomTemp = availablePool[Math.floor(Math.random() * availablePool.length)];
        storeName.textContent = randomTemp.name;
        ballNum.textContent = Math.floor(Math.random() * 99) + 1;
      }, 80);

      // 2 秒後開獎
      setTimeout(function() {
        clearInterval(timer);
        ball.classList.remove('rolling');

        var finalWinner = availablePool[Math.floor(Math.random() * availablePool.length)];
        var luckyNum = Math.floor(Math.random() * 89) + 10;

        ballNum.textContent = luckyNum;
        storeName.textContent = finalWinner.name;
        storeStatus.textContent = '🎉 今日幸運首選 (已避開公休)';

        if (finalWinner.map && finalWinner.map.trim() !== '') {
          mapBtn.href = finalWinner.map;
          mapBtn.style.display = 'block';
        } else {
          mapBtn.href = 'https://www.google.com/maps/search/' + encodeURIComponent(finalWinner.name);
          mapBtn.style.display = 'block';
        }

        isRolling = false;
      }, 2000);
    }

    window.onload = function() {
      initDay();
    };
  </script>
</body>
</html>
